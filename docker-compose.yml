# ==================================================================================================
# ARCHIVO DE ORQUESTACIÓN DE CONTENEDORES (DOCKER COMPOSE)
# Aquí se define toda la infraestructura que necesitan nuestros microservicios para funcionar localmente.
#
# Para levantar todo: docker-compose up -d
# Para detener todo: docker-compose down
# Para ver logs:     docker-compose logs -f [nombre-servicio]
# ==================================================================================================

services:
  # ----------------------------------------------------------------------------------------------
  # MONGODB: Base de datos NoSQL usada como nuestro "Event Store" (Almacén de eventos).
  # Guarda cada evento de dominio como un documento JSON de forma secuencial e inmutable.
  # En Event Sourcing, MongoDB es ideal porque los eventos nunca se modifican — solo se insertan.
  # ----------------------------------------------------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: mongodb
    restart: always
    # Iniciamos Mongo como un "Replica Set" (rs0).
    # Las TRANSACCIONES en MongoDB SOLO están disponibles en modo Replica Set.
    # Sin esto, las operaciones multi-documento no son atómicas y Event Sourcing pierde consistencia.
    command: [ "--replSet", "rs0", "--bind_ip_all", "--port", "27017" ]
    ports:
      - 27017:27017
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      # Este script inicializa automáticamente el Replica Set si aún no está configurado.
      # rs.status() verifica si ya está iniciado; si no, rs.initiate() lo configura.
      # interval: cada cuánto se ejecuta el check.
      # timeout: tiempo máximo para que el check responda.
      # retries: cuántas fallas seguidas antes de marcar el contenedor como "unhealthy".
      test: echo "try { rs.status() } catch (err) { rs.initiate({_id:'rs0',members:[{_id:0,host:'host.docker.internal:27017'}]}) }" | mongosh --port 27017 --quiet
      interval: 5s
      timeout: 30s
      start_period: 0s
      start_interval: 1s
      retries: 30
    volumes:
      # Persistimos los datos de MongoDB en volúmenes Docker.
      # Sin esto, cada "docker-compose down" borraría todos los eventos almacenados.
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb

  # ----------------------------------------------------------------------------------------------
  # ZOOKEEPER: Servicio de coordinación distribuida requerido por Kafka (modo clásico, sin KRaft).
  # Lleva el registro de: qué brokers están vivos, cuáles son los líderes de cada partición,
  # y el estado de los tópicos. Kafka no puede funcionar sin él en esta configuración.
  # ----------------------------------------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.3
    container_name: zookeeper
    tmpfs: "/zktmp"
    restart: always
    ports:
      - "2181:2181"
    volumes:
      - "zookeeper_data:/bitnami"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181      # Puerto por el que Kafka se conecta a Zookeeper
      ZOOKEEPER_TICK_TIME: 2000        # Unidad de tiempo base (ms) para heartbeats
      ZOOKEEPER_INIT_LIMIT: 10         # Ticks máximos para sincronización inicial de followers
      ZOOKEEPER_SYNC_LIMIT: 5          # Ticks máximos para sincronización en régimen normal
      ZOOKEEPER_4LW_COMMANDS_WHITELIST: "ruok,stat,conf,isro,mntr,wchc,wchp,wchx"
    # MEJORA: Healthcheck para Zookeeper.
    # "ruok" (Are You OK?) es el comando estándar de diagnóstico de Zookeeper — responde "imok" si está listo.
    # Kafka esperará a que este check pase antes de intentar conectarse.
    healthcheck:
      test: echo ruok | nc -w 2 localhost 2181 | grep imok
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ----------------------------------------------------------------------------------------------
  # KAFKA: Nuestro "Message Broker" (Bus de Eventos).
  # El microservicio Command publica eventos aquí. El microservicio Query los consume
  # para replicar los datos en PostgreSQL. Permite comunicación asíncrona y desacoplada.
  # ----------------------------------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.6.3
    container_name: kafka
    ports:
      - "9092:9092"   # Puerto INTERNO: para comunicación entre contenedores dentro de Docker
      - "29092:29092" # Puerto EXTERNO: para acceso desde tu máquina (localhost:29092 en appsettings)
    restart: always
    volumes:
      - "kafka_data:/bitnami"
    environment:
      KAFKA_BROKER_ID: 1

      # CORRECCIÓN: Las imágenes de confluentinc/cp-kafka usan variables SIN el prefijo "CFG_".
      # El prefijo "CFG_" es exclusivo de las imágenes de Bitnami.
      # Antes había variables duplicadas (con y sin CFG_), lo que causaba comportamiento impredecible.
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"

      # Configuración de red (Listeners):
      # INTERNAL: red privada entre contenedores de Docker (ej: Ticketing.command → kafka:9092)
      # EXTERNAL: red pública hacia tu máquina host (ej: tu código en VS → localhost:29092)
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_LISTENERS: "INTERNAL://:9092,EXTERNAL://:29092"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:9092,EXTERNAL://localhost:29092"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      ALLOW_PLAINTEXT_LISTENER: 'yes'

      # Factor de replicación = 1 porque solo tenemos 1 broker (ambiente local).
      # En producción esto debería ser mínimo 3 para alta disponibilidad.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

    # MEJORA: depends_on con condition: service_healthy.
    # Antes: Kafka arrancaba en cuanto el contenedor de Zookeeper existía (aunque no estuviera listo).
    # Ahora: Kafka espera a que el healthcheck de Zookeeper pase antes de iniciar.
    # Esto elimina los errores de "Connection refused" en el arranque.
    depends_on:
      zookeeper:
        condition: service_healthy

    # MEJORA: Healthcheck para Kafka.
    # kafka-broker-api-versions valida que el broker responde correctamente a peticiones de API.
    healthcheck:
      test: kafka-broker-api-versions --bootstrap-server localhost:9092
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ----------------------------------------------------------------------------------------------
  # KAFKA-UI: Interfaz web visual para inspeccionar el broker de Kafka.
  # Entra a http://localhost:8080 para ver tópicos, mensajes, grupos de consumidores, etc.
  # Imprescindible para debugging: verifica que el Producer mandó bien los eventos
  # y que el Consumer los está leyendo correctamente.
  # ----------------------------------------------------------------------------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafkaui
    restart: always  # MEJORA: Si kafka-ui se cae, Docker lo reinicia automáticamente
    # MEJORA: Espera a que Kafka esté saludable antes de intentar conectarse.
    # Sin esto, kafka-ui podría arrancar antes que Kafka y mostrar errores de conexión en la UI.
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092 # Se conecta por la red interna de Docker
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181

  # ----------------------------------------------------------------------------------------------
  # POSTGRESQL: Base de datos Relacional para el Query Side (Lectura).
  # En CQRS, el lado de lectura usa una BD optimizada para SELECTs y JOINs rápidos.
  # Aquí guardamos el "Materialized View" de los tickets replicados desde los eventos de Kafka.
  # ----------------------------------------------------------------------------------------------
  postgres:
    image: postgres:16.0
    container_name: postgresql
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      # CORRECCIÓN: El nombre de la BD debe coincidir EXACTAMENTE con el appsettings.json.
      # Antes era "clean_architecture" (con guión bajo) pero appsettings.json dice "cleanarchitecture".
      # Una discrepancia aquí hace que ApplyMigration() falle al intentar conectarse.
      - POSTGRES_DB=cleanarchitecture
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    ports:
      - 5432:5432
    # MEJORA: Healthcheck para PostgreSQL.
    # pg_isready verifica que el servidor acepte conexiones.
    # Los microservicios que dependen de Postgres deberían usar "condition: service_healthy"
    # para no arrancar hasta que la BD esté lista para recibir queries.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cleanarchitecture"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

# ==================================================================================================
# VOLÚMENES PERSISTENTES:
# Docker destruye todos los datos de un contenedor cuando se elimina.
# Declarar "volumes" aquí crea almacenamiento persistente en tu disco local.
# Los datos sobreviven a: docker-compose down, reinicios, actualizaciones de imagen.
# Para borrar los datos intencionalmente: docker-compose down -v
# ==================================================================================================
volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  kafka_data:
    driver: local
  zookeeper_data:
    driver: local
  postgres_data:
    driver: local

# ==================================================================================================
# RED COMPARTIDA:
# Todos los servicios de este compose comparten esta red virtual.
# Permite que los contenedores se comuniquen entre sí usando el nombre del servicio como hostname.
# Ejemplo: kafka puede llamar a "zookeeper:2181" y Docker resuelve la IP automáticamente.
# ==================================================================================================
networks:
  default:
    name: microserviceNetwork
